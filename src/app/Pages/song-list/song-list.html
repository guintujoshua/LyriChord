<app-head-tool-bar-nav></app-head-tool-bar-nav>

<div class="song-list-container">

  <h2>Song List</h2>

  <!-- Search -->
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Search songs</mat-label>
    <input
      matInput
      (keyup)="applyFilter($event)"
      placeholder="Search title, artist, album">
  </mat-form-field>

  <!-- Table -->
  <div class="table-wrapper">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z2 song-table">

    <!-- Title -->
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Title</th>
      <td mat-cell *matCellDef="let song">
        <a [routerLink]="['/song', song.slug]" class="song-link">{{ song.title }}</a>
      </td>
    </ng-container>

    <!-- Artist -->
    <ng-container matColumnDef="artist">
      <th mat-header-cell *matHeaderCellDef>Artist</th>
      <td mat-cell *matCellDef="let song">{{ song.artist }}</td>
    </ng-container>

    <!-- Album -->
    <ng-container matColumnDef="album">
      <th mat-header-cell *matHeaderCellDef>Album</th>
      <td mat-cell *matCellDef="let song">{{ song.album }}</td>
    </ng-container>

    <!-- Year -->
    <ng-container matColumnDef="year">
      <th mat-header-cell *matHeaderCellDef>Year</th>
      <td mat-cell *matCellDef="let song">{{ song.year }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
  </div>

  <!-- Pagination -->
  <mat-paginator
    [pageSize]="5"
    [pageSizeOptions]="[5, 10, 20]"
    showFirstLastButtons>
  </mat-paginator>

</div>

<app-general-footer></app-general-footer>
