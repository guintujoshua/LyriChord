<mat-toolbar color="primary" class="navbar">
  <div class="logo">
    🎵 LyriChord
  </div>

  <span class="spacer"></span>

  <div class="nav-actions">
    <button mat-button routerLink="/">Home</button>
    <button mat-button routerLink="/SongList">Songs</button>
    <button mat-button>Artists</button>
    <button mat-icon-button (click)="toggleDarkMode()" aria-label="Toggle dark mode">
      <mat-icon>{{ isDark ? 'dark_mode' : 'light_mode' }}</mat-icon>
    </button>
    <button mat-raised-button color="accent">Login</button>
  </div>

</mat-toolbar>
